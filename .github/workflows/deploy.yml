name: Deploy manual
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::613069086586:role/fidentra-training-manual-deploy
          aws-region: ap-southeast-2
      - run: aws s3 cp index.html s3://fidentra-training-manual-613069086586/index.html --content-type "text/html; charset=utf-8"
      - run: aws cloudfront create-invalidation --distribution-id E3S28RMVJSZVQ1 --paths "/*"
